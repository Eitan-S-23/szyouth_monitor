# .github/workflows/monitor.yml
name: 青年驿站监控

on:
  schedule:
    # 每30分钟执行一次（UTC时间）
    # 若需限定在北京时间8:00-22:00，可将下一行改为：cron: '*/30 0-14 * * *'
    - cron: '*/30 * * * *'
  workflow_dispatch:   # 支持手动触发，方便测试

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5   # 防止意外卡死

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install requests>=2.28.0

      - name: 运行监控脚本
        env:
          # 从 GitHub Secrets 中读取 Webhook Key
          SZYOUTH_WEBHOOK_KEY: ${{ secrets.SZYOUTH_WEBHOOK_KEY }}
        run: |
          python szyouth_monitor.py \
            -x 30 \
            -y 10 \
            -s all \
            --once
